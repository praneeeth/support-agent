name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Skip until app code exists
        id: gate
        run: |
          if [ -f pyproject.toml ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen
      - if: steps.gate.outputs.run == 'true'
        run: uv run ruff check . && uv run ruff format --check .
      - if: steps.gate.outputs.run == 'true'
        run: uv run mypy app
      - if: steps.gate.outputs.run == 'true'
        run: uv run pytest -q -rs --cov=app --cov-fail-under=85

  docker:
    # The image a customer would run: builds, seeds itself on start, and answers.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t support-agent:ci .
      - name: Start container
        run: docker run -d --name app -p 8000:8000 -e LLM_PROVIDER=openai_compatible support-agent:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' app)" = "true" ] || break
            sleep 3
          done
          docker logs app; exit 1
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/healthz
          curl -fsS localhost:8000/chat/widget.js | grep -q '"brand": "Northwind Goods"'
          curl -fsS -o /dev/null localhost:8000/chat/demo
      - name: Seeding survives a restart
        run: |
          docker restart app
          for i in $(seq 1 40); do curl -fsS localhost:8000/healthz && exit 0; sleep 3; done
          docker logs app; exit 1
      - if: failure()
        run: docker logs app || true

  evals:
    # Real Claude calls — only when agent behaviour could change.
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            agent:
              - 'app/agent/**'
              - 'app/knowledge_base/**'
              - 'verticals/**'
              - 'evals/**'
      - if: steps.changes.outputs.agent == 'true' && hashFiles('evals/run.py') != ''
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - if: steps.changes.outputs.agent == 'true' && hashFiles('evals/run.py') != ''
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          if [ -z "$LLM_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No model credentials configured — skipping evals."; exit 0
          fi
          uv sync --frozen
          uv run python -m app.seed
          uv run python -m evals.run --min-answer 0.90 --min-escalation 0.95 --summary evals-summary.md
      - if: always() && hashFiles('evals-summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: evals
          path: evals-summary.md
