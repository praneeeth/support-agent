# AI code review on every PR (alibaba/open-code-review), using Claude.
# Setup (repo Settings -> Secrets and variables -> Actions):
#   secret   ANTHROPIC_API_KEY
#   variable OCR_LLM_MODEL      e.g. the Claude model id you want reviews on
# Re-run on demand by commenting "/open-code-review" on the PR.

name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && startsWith(github.event.comment.body, '/open-code-review')
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/open-code-review')
      )
    steps:
      - name: Check for model credentials
        id: creds
        env:
          KEY: ${{ secrets.OCR_LLM_TOKEN || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No model credentials — review skipped. Run 'ocr review' locally instead (delegation mode needs no key)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR context
        id: pr-context
        if: steps.creds.outputs.run == 'true' && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Run OpenCodeReview
        if: steps.creds.outputs.run == 'true'
        uses: alibaba/open-code-review@main
        with:
          # Defaults to Anthropic; for an OpenAI-compatible provider set the OCR_LLM_URL /
          # OCR_LLM_TOKEN secrets and OCR_USE_ANTHROPIC=false variable.
          llm_url: ${{ vars.OCR_LLM_URL || 'https://api.anthropic.com' }}
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN || secrets.ANTHROPIC_API_KEY }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_USE_ANTHROPIC || 'true' }}
          effort: medium
          incremental: 'true'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
