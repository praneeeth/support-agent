<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Support queue{% endblock %} · Northwind Goods</title>
  <script src="/static/htmx-2.0.4.min.js"></script>
  <style>
    :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#0f766e; --warn:#b45309; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:12px 24px; border-bottom:1px solid var(--line); background:#fff; }
    header a { color:var(--fg); text-decoration:none; font-weight:600; }
    main { max-width:960px; margin:0 auto; padding:24px; }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#fef3c7; color:var(--warn); }
    .msg { padding:10px 12px; margin:8px 0; border-radius:8px; background:#fff; border:1px solid var(--line); }
    .msg.staff { border-color:var(--accent); }
    .role { font-size:12px; color:var(--muted); }
    textarea { width:100%; min-height:90px; padding:10px; font:inherit; }
    button { padding:8px 14px; font:inherit; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
    button.secondary { background:#e7e5e4; color:var(--fg); }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <header><a href="/staff">Northwind Goods · Support queue</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
