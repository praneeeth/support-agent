<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inbox{% endblock %} · {{ brand }}</title>
  <script>
    /* Before first paint, so a chosen theme never flashes the other one. */
    try { var t = localStorage.getItem("portal-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="/static/htmx-2.0.4.min.js"></script>
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">{{ brand }} <span>· Support</span></span>
    <nav class="tabs">
      <a href="/staff" class="{{ 'on' if section == 'inbox' }}">Inbox{% if open_count %} ({{ open_count }}){% endif %}</a>
      <a href="/admin" class="{{ 'on' if section == 'overview' }}">Overview</a>
      <a href="/admin/knowledge" class="{{ 'on' if section == 'knowledge' }}">Knowledge</a>
      <a href="/admin/playground" class="{{ 'on' if section == 'playground' }}">Playground</a>
      <a href="/admin/integrations" class="{{ 'on' if section == 'integrations' }}">Integrations</a>
    </nav>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme-set="light" aria-pressed="false" title="Light theme" aria-label="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-theme-set="system" aria-pressed="false" title="Match system" aria-label="Match system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark theme" aria-label="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (function () {
      var html = document.documentElement;
      var buttons = document.querySelectorAll("[data-theme-set]");
      function mark() {
        var current = html.dataset.theme || "system";
        buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.themeSet === current)); });
      }
      buttons.forEach(function (b) {
        b.addEventListener("click", function () {
          var choice = b.dataset.themeSet;
          if (choice === "system") delete html.dataset.theme; else html.dataset.theme = choice;
          try { if (choice === "system") localStorage.removeItem("portal-theme"); else localStorage.setItem("portal-theme", choice); } catch (e) {}
          mark();
        });
      });
      mark();
    })();
  </script>
</body>
</html>
