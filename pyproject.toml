[project]
name = "support-agent"
version = "0.1.0"
description = "AI support agent for a small e-commerce store"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "faker>=26",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/orders/seed.py" = ["S311"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: uses the real embedding model",
    "live: calls the real Anthropic API",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]
