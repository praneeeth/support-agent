# Seaside Homestay — the second vertical, and the proof that a new business is config, not code.
# A three-room family homestay in Gokarna. The owner confirms every stay personally; the
# assistant answers questions, checks dates and passes on enquiries. It never books anything.
id: seaside-homestay

business:
  name: Seaside Homestay
  kind: a three-room family homestay
  location: Gokarna, Karnataka, India
  currency_symbol: "₹"
  hours: "every day, 8am–8pm IST"
  reference_name: booking reference
  reference_format: SS-1234

docs_dir: docs

tools:
  - check_availability
  - booking_enquiry

# Added to the built-in guards, which always apply. A homestay never haggles, never confirms a
# stay, and never says a room is free unless the availability tool just said so.
guardrails:
  reference_pattern: '\bSS-\d{4}\b'
  restricted:
    # Rate negotiation: requests, not questions about published discounts.
    - '\b(can|could|will|would) you\b.{0,25}\b(discount|reduce|lower|match|negotiate|do better|better (price|rate|deal))\b'
    - '\b(give|get|offer) (me|us)\b.{0,20}\b(discount|deal|better (price|rate)|lower (price|rate))\b'
    - '\bmatch (that|the|their|this|airbnb''s|booking''s) (price|rate)\b'
    - '\bnegotiat\w*\b'
    # Confirming or holding a stay: only the owner does that.
    - '\b(please|pls|can you|could you|will you)\b.{0,10}\b(confirm|hold|block|reserve|keep)\b.{0,25}\b(booking|reservation|room|cottage|dates|it)\b'
    - '^\s*(confirm|hold|reserve|block)\b.{0,25}\b(booking|reservation|room|cottage|dates)\b'
  human:
    - '\b(talk|speak|chat)\b.{0,15}\b(owner|meera|manager)\b'
  lookup:
    - '\b\d{4}-\d{2}-\d{2}\b'
    - '\b(availab\w*|vacanc\w*|any rooms?|rooms? free)\b'
  never_say:
    - "Never say or imply that a room, date or booking is confirmed, reserved or held. Only the owner confirms a stay, once the advance is paid; use booking_enquiry to pass a request on."
    - "Never offer, negotiate or promise a discount or a different rate. The published rates and the long-stay discount in the sources are the only prices."
    - "Never say a room is free on particular dates unless check_availability returned that in this turn."
  claims:
    - name: availability not checked
      pattern: '\b(is|are|it''s|looks|we have|there''s)\b.{0,30}\b(available|free|open)\b.{0,40}\b(on|from|for|between|those dates|these dates)\b'
      requires_tool: check_availability
    - name: stay promised
      pattern: '\b(booking|reservation|room|cottage|stay|dates?)\s+(is|are|has been|have been)\s+(now\s+)?(confirmed|reserved|booked|held|secured)\b(?!\s+(only|once|when|after|until))|\b(i''ve|i have|we''ve|we have)\s+(booked|reserved|confirmed|held)\b'

# Rooms, rates and closed dates. With ICAL_URLS set, the Airbnb/Booking.com calendars close
# the whole house on their busy dates too.
availability:
  min_nights: 2
  max_nights: 14
  horizon_days: 365
  rooms:
    - name: Sea View Room
      sleeps: 2
      nightly_rate: 4500
    - name: Garden Room
      sleeps: 3
      nightly_rate: 3800
    - name: Family Cottage
      sleeps: 4
      nightly_rate: 6500
  blocked:
    - start: 2026-12-20   # festive season: the whole house is taken
      end: 2027-01-06
    - room: Sea View Room
      start: 2026-11-13
      end: 2026-11-16

widget:
  greeting: "Hi! Ask me about rooms, dates, getting here or anything about your stay."
  tagline: "Replies instantly · Meera confirms every booking"
  accent: "#0e7490"
  suggestions:
    - What are your room rates?
    - How do I get there from Goa airport?
    - Do you allow dogs?
